name: trufit_bodamma
description: "TruFit Bodamma - Personal Fitness Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.70.2
  youtube_player_iframe: ^6.0.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  google_generative_ai: ^0.4.6
  flutter_secure_storage: ^10.3.1
  health: ^13.3.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.1
  archive: ^4.0.9
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  image_cropper: ^12.2.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  connectivity_plus: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
